# Nginx site config for tech-abreast.com
# Copy to /etc/nginx/sites-available/tech-abreast, enable it, then run certbot
# to add HTTPS (certbot edits this file for you).

server {
    listen 80;
    listen [::]:80;
    server_name tech-abreast.com www.tech-abreast.com;

    client_max_body_size 10m;

    # Long-lived cache for Next.js build assets
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
